{% extends "base.html" %}
{% block title %}Process lịch hẹn{% endblock %}
{% block content %}
<div class="toolbar">
    <a class="ghost-btn inline-flex items-center" href="/appointments"><i data-lucide="arrow-left"></i><span class="ml-2">Quay lại lịch hẹn</span></a>
</div>
<section class="form-panel">
    <div class="panel-title"><div><h2>{{ appointment.prospect_name or "Lịch hẹn" }}</h2><p>Cập nhật thông tin tư vấn trước khi lưu hoặc chuyển thành khách đã chốt.</p></div></div>
    <form class="form-grid membership-form-grid" method="post">
        <div class="form-field"><label>Tên khách</label><input class="form-control" name="prospect_name" value="{{ appointment.prospect_name or (appointment.customer.person.display_name if appointment.customer else '') }}" required></div>
        <div class="form-field"><label>Bộ môn quan tâm</label><input class="form-control" name="discipline_interest" value="{{ appointment.discipline_interest or appointment.appointment_type }}" required></div>
        <div class="form-field"><label>Nhân viên chăm sóc</label><select class="form-control" name="employee_id" required><option value="">Chọn nhân viên</option>{% for e in employees %}<option value="{{ e.id }}" {{ "selected" if appointment.employee_id == e.id else "" }}>{{ e.person.display_name }}</option>{% endfor %}</select></div>
        <div class="form-field"><label>Ngày hẹn</label><input class="form-control" type="date" name="appointment_date" value="{{ appointment.scheduled_at.date().isoformat() }}" required></div>
        <div class="form-field"><label>Giờ hẹn</label><input class="form-control" type="time" name="appointment_time" value="{{ appointment.scheduled_at.strftime('%H:%M') }}" required></div>
        <div class="form-field"><label>Nền tảng tiếp cận</label><input class="form-control" name="access_platform" value="{{ appointment.access_platform or '' }}"></div>
        <div class="form-field"><label>Nhân viên hỗ trợ trực tiếp</label><select class="form-control" name="support_employee_id"><option value="">Không có</option>{% for e in employees %}<option value="{{ e.id }}" {{ "selected" if appointment.support_employee_id == e.id else "" }}>{{ e.person.display_name }}</option>{% endfor %}</select></div>
        <div class="form-field"><label>Tình trạng</label><select class="form-control" name="status">{% for s in ["Đã lên lịch", "suy nghĩ thêm"] %}<option value="{{ s }}" {{ "selected" if appointment.status == s or (appointment.status == "chưa" and s == "Đã lên lịch") else "" }}>{{ s }}</option>{% endfor %}</select></div>
        <div class="form-field modal-span"><label>Ghi chú</label><textarea class="form-control textarea-control" name="note">{{ appointment.note or "" }}</textarea></div>
        <div class="form-field modal-span"><label>Ghi chú sau tư vấn</label><textarea class="form-control textarea-control" name="consultation_note">{{ appointment.consultation_note or "" }}</textarea></div>
        <div class="form-actions modal-span gap-2">
            <button class="ghost-btn" type="submit" name="action" value="save">Lưu</button>
            <button class="submit-btn" type="submit" name="action" value="closed">Khách đã chốt</button>
        </div>
    </form>
</section>
{% endblock %}
